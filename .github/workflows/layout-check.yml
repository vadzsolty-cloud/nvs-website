name: Browser layout regression
on:
  pull_request:
    branches: [dev/website-v1]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: mkdir -p artifacts && node scripts/check-layout.cjs && node scripts/check-privacy.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: layout-screenshots
          path: artifacts/*.png
