name: Isolated booking emulator tests
on:
  push:
    branches: [feat/issue-1-contact-booking-emulator]
  pull_request:
    branches: [dev/website-v1]
permissions:
  contents: read
jobs:
  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-nvs-website
      FIREBASE_CLI_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix emulator --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix emulator/functions --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix backend/functions --ignore-scripts --no-audit --no-fund
      - run: node --test backend/functions/mail.test.mjs
      - name: Static build and tests
        run: npm run build && npm test
      - name: Build local-only HU/RO/EN lab
        run: npm run build
        env:
          EMULATOR_UI: 'true'
          SITE_URL: http://localhost:4180
          BASE_PATH: /nvs-website
          OUTPUT_DIR: artifacts/emulator-ui
      - name: Auth, Firestore, Functions and local mail sink
        run: npm test --prefix emulator
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-diagnostics
          path: |
            emulator/*debug.log
          if-no-files-found: ignore
